<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio JS</title>
    <style>
    
.neon-text {
    color: #fff;
    text-shadow: 0 0 5px #ff00de, 0 0 10px #ff00de, 0 0 20px #ff00de;
}


.outline-text {
    color: transparent;
    -webkit-text-stroke: 2px #00f0ff;
}


.retro-shadow {
    color: #ffe600;
    text-shadow: 3px 3px 0px #ff3366, 6px 6px 0px #000000;

}
</style>
</head>

<body>
   <div id="tarjeta">
    <h1>Aprender es descubrir que algo es posible</h1>
   </div> 

   <button onclick="neon-text()">Neon</button>
   <button onclick="outline-text()">Delineado</button>
   <button onclick="retro-shadow()">Sombra</button>

    <script src="js/script.js"></script>
</body>
</html>
